[package]
name = "ultimate-project-assister"
version = "1.10.0"
description = "Project radar, cleaner, goals and board in one place."
authors = ["DanSketic"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/DanSketic/Ultimate-Project-Assister"
homepage = "https://github.com/DanSketic/Ultimate-Project-Assister"

[lib]
name = "upa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Local repository inspection. No network transports are needed - we only ever
# read repositories that already exist on disk.
git2 = { version = "0.20", default-features = false }

walkdir = "2"
rayon = "1"
notify = "8"
chrono = "0.4"
sysinfo = "0.33"
anyhow = "1"
tauri-plugin-notification = "2"
# One window, however many times it is launched: with the app carrying on in
# the tray, a second start should raise the first rather than fight it for the
# settings file.
tauri-plugin-single-instance = "2"

# The listening-socket table. `netstat` no longer shows listeners on recent
# Windows builds, see `ports::listener_table`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"

[features]
# This feature is used for production builds where `devUrl` points to the
# bundled frontend instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
